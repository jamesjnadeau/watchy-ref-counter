; Watchy Ref Counter
;
; The sketch lives in RefCounter/ so the same folder works unchanged as an
; Arduino IDE sketch (RefCounter/RefCounter.ino) and as the PlatformIO source
; directory. Two boards are supported; pick the env that matches yours:
;
;   pio run -e watchy_v2 -t upload      (default; Watchy V2.0, ESP32)
;   pio run -e watchy_c6 -t upload      (this repo's own board)
;
; Watchy V1.0, V1.5 and V3 are not supported; board.h stops the build if their
; revision flags are set, including the ARDUINO_ESP32S3_DEV that picking an S3
; board would define for you.

[platformio]
src_dir = RefCounter
default_envs = watchy_v2

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; This project is self-contained: it does not use the Watchy library. The panel
; is driven by GxEPD2's own GDEY0154D67 driver, the RTC chips are talked to
; directly over Wire, and NTP goes through the ESP32 core's SNTP client.
lib_deps =
    zinggjm/GxEPD2@^1.6.0
    adafruit/Adafruit GFX Library@^1.11.9
    https://github.com/tzapu/WiFiManager.git#v2.0.17

; huge_app leaves room for the WiFi stack.
board_build.partitions = huge_app.csv

; --- Watchy V2.0 (ESP32) ---------------------------------------------------
; A generic ESP32 board; the pin map is this project's own, in board.h. The
; revision define is what selects it over the C6 map.
[env:watchy_v2]
board = esp32dev
build_flags = -D ARDUINO_WATCHY_V20

; --- This repo's own board (ESP32-C6-MINI-1 / RV-3028-C7) -------------------
; The design in board-files/. Its pin map is in RefCounter/board.h under
; ARDUINO_ESP32C6_DEV and comes from board-files/elec/src/watchy.ato.
;
; This env overrides `platform`. The official `espressif32` platform tops out
; at Arduino-ESP32 2.0.17, which has no ESP32-C6 support at all -- it fails
; with "This board doesn't support arduino framework!". C6 support arrived in
; Arduino-ESP32 3.0, and the community pioarduino fork is what packages 3.x
; for PlatformIO; Espressif no longer maintains the official one. Pinned to an
; exact release for the same reason atopile is: so a rebuild is reproducible.
;
; watchy_v2 is untouched and still builds on the official espressif32.
[env:watchy_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
build_flags = -D ARDUINO_ESP32C6_DEV
