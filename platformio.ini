; Watchy Ref Counter
;
; The sketch lives in RefCounter/ so the same folder works unchanged as an
; Arduino IDE sketch (RefCounter/RefCounter.ino) and as the PlatformIO source
; directory. Pick the env that matches your hardware:
;
;   pio run -e watchy_v2 -t upload      (default)
;   pio run -e watchy_v3 -t upload

[platformio]
src_dir = RefCounter
default_envs = watchy_v2

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; This project is self-contained: it does not use the Watchy library. The panel
; is driven by GxEPD2's own GDEH0154D67 driver, the RTC chips are talked to
; directly over Wire, and NTP goes through the ESP32 core's SNTP client.
lib_deps =
    zinggjm/GxEPD2@^1.6.0
    adafruit/Adafruit GFX Library@^1.11.9
    https://github.com/tzapu/WiFiManager.git#v2.0.17

; huge_app leaves room for the WiFi stack.
board_build.partitions = huge_app.csv

; --- ESP32 revisions -------------------------------------------------------
; Generic ESP32 boards; the pin map is this project's own, in board.h. The
; revision define is what selects between them.
[env:watchy_v2]
board = esp32dev
build_flags = -D ARDUINO_WATCHY_V20

[env:watchy_v15]
board = esp32dev
build_flags = -D ARDUINO_WATCHY_V15

[env:watchy_v10]
board = esp32dev
build_flags = -D ARDUINO_WATCHY_V10

; --- ESP32-S3 revision -----------------------------------------------------
[env:watchy_v3]
board = esp32-s3-devkitc-1
build_flags = -D ARDUINO_ESP32S3_DEV
