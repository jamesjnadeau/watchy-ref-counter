; Watchy Ref Counter
;
; The sketch lives in RefCounter/ so the same folder works unchanged as an
; Arduino IDE sketch (RefCounter/RefCounter.ino) and as the PlatformIO source
; directory. Pick the env that matches your hardware:
;
;   pio run -e watchy_v2 -t upload      (default)
;   pio run -e watchy_v3 -t upload

[platformio]
src_dir = RefCounter
default_envs = watchy_v2

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Uses the Watchy checkout sitting next to this repo. To build against
; upstream instead, replace the symlink line with:
;   https://github.com/sqfmi/Watchy.git
;
; Rtc_Pcf8563 is pinned deliberately. Watchy's library.json asks for
; orbitalair/Rtc_Pcf8563.git#master, and that master has since grown a
; Rtc_Pcf8563(WireBase&) constructor referencing a type the ESP32 core does not
; have, so it no longer compiles. The registry build is the last one that
; matches the API WatchyRTC.cpp calls. Nothing in this sketch touches the RTC;
; it only has to compile because the Watchy library links as a whole.
lib_deps =
    symlink://../Watchy
    elpaso/Rtc_Pcf8563

; --- ESP32 revisions -------------------------------------------------------
; The `watchy` board supplies the pin map via its variant. The revision define
; is still required on top of it: Watchy's pins_arduino.h picks UP_BTN_PIN and
; BATT_ADC_PIN from it, and those two differ between revisions.
[env:watchy_v2]
board = watchy
build_flags = -D ARDUINO_WATCHY_V20

[env:watchy_v15]
board = watchy
build_flags = -D ARDUINO_WATCHY_V15

[env:watchy_v10]
board = watchy
build_flags = -D ARDUINO_WATCHY_V10

; --- ESP32-S3 revision -----------------------------------------------------
; No Watchy V3 board exists in PlatformIO, so this uses the generic S3 devkit.
; That is fine here: for V3, Watchy's own config.h defines the whole pin map
; directly rather than deferring to a board variant.
[env:watchy_v3]
board = esp32-s3-devkitc-1
build_flags = -D ARDUINO_ESP32S3_DEV
